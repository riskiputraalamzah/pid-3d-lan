<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Panduan Urutan Warna Kabel UTP Standar T568B dan T568A">
  <rect x="6" y="6" width="808" height="288" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="410" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">STANDAR PENGKABELAN UTP (KLIP RJ-45 DI BAWAH, PIN 1 DARI KIRI)</text>

  <!-- T568B Panel -->
  <rect x="26" y="56" width="372" height="218" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <rect x="26" y="56" width="372" height="34" rx="12" fill="#0284C7"/>
  <text x="212" y="78" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T568B (Standar Umum Straight-Through)</text>

  <!-- 8 wires T568B -->
  <!-- 1: PO -->
  <rect x="44" y="106" width="34" height="110" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="3"/>
  <line x1="46" y1="126" x2="76" y2="112" stroke="#F97316" stroke-width="6"/>
  <line x1="46" y1="156" x2="76" y2="142" stroke="#F97316" stroke-width="6"/>
  <line x1="46" y1="186" x2="76" y2="172" stroke="#F97316" stroke-width="6"/>
  <text x="61" y="236" font-family="monospace" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">1</text>
  <text x="61" y="254" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">P-O</text>

  <!-- 2: O -->
  <rect x="86" y="106" width="34" height="110" rx="6" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
  <text x="103" y="236" font-family="monospace" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">2</text>
  <text x="103" y="254" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">O</text>

  <!-- 3: PH -->
  <rect x="128" y="106" width="34" height="110" rx="6" fill="#FFFFFF" stroke="#16A34A" stroke-width="3"/>
  <line x1="130" y1="126" x2="160" y2="112" stroke="#16A34A" stroke-width="6"/>
