  <line x1="610" y1="126" x2="640" y2="112" stroke="#2563EB" stroke-width="6"/>
  <line x1="610" y1="156" x2="640" y2="142" stroke="#2563EB" stroke-width="6"/>
  <line x1="610" y1="186" x2="640" y2="172" stroke="#2563EB" stroke-width="6"/>
  <text x="625" y="236" font-family="monospace" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">5</text>
  <text x="625" y="254" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">P-B</text>

  <!-- 6: O -->
  <rect x="650" y="106" width="34" height="110" rx="6" fill="#F97316" stroke="#C2410C" stroke-width="2"/>
  <text x="667" y="236" font-family="monospace" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">6</text>
  <text x="667" y="254" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">O</text>

  <!-- 7: PC -->
  <rect x="692" y="106" width="34" height="110" rx="6" fill="#FFFFFF" stroke="#92400E" stroke-width="3"/>
  <line x1="694" y1="126" x2="724" y2="112" stroke="#92400E" stroke-width="6"/>
  <line x1="694" y1="156" x2="724" y2="142" stroke="#92400E" stroke-width="6"/>
  <line x1="694" y1="186" x2="724" y2="172" stroke="#92400E" stroke-width="6"/>
