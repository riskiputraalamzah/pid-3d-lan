  <text x="145" y="254" font-family="sans-serif" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">P-H</text>

  <!-- 4: B -->
  <rect x="170" y="106" width="34" height="110" rx="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="187" y="236" font-family="monospace" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">4</text>
