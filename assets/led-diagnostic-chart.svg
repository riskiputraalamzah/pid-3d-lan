<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" width="820" height="230" role="img" aria-label="Pola Diagnosis LED LAN Tester: Normal, Open, Miswired, dan Short">
  <rect x="6" y="6" width="808" height="218" rx="18" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="410" y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC" text-anchor="middle">PANDUAN CEPAT MEMBACA POLA LED LAN TESTER (MASTER vs REMOTE)</text>

  <!-- 1. Normal Straight -->
  <rect x="24" y="52" width="182" height="154" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="115" y="76" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399" text-anchor="middle">NORMAL (STRAIGHT)</text>
  <text x="115" y="108" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">M: 1-2-3-4-5-6-7-8</text>
  <text x="115" y="128" font-family="monospace" font-size="11" fill="#34D399" text-anchor="middle">R: 1-2-3-4-5-6-7-8</text>
  <circle cx="80" cy="158" r="8" fill="#10B981"/>
  <circle cx="103" cy="158" r="8" fill="#10B981"/>
  <circle cx="126" cy="158" r="8" fill="#10B981"/>
  <circle cx="149" cy="158" r="8" fill="#10B981"/>
  <text x="115" y="190" font-family="sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Berurutan Identik</text>

  <!-- 2. Open / Putus -->
  <rect x="220" y="52" width="182" height="154" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <text x="311" y="76" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FB7185" text-anchor="middle">OPEN (KABEL PUTUS)</text>
  <text x="311" y="108" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">M: 1-2-[3]-4-5-6-7-8</text>
  <text x="311" y="128" font-family="monospace" font-size="11" fill="#FB7185" text-anchor="middle">R: 1-2-[X]-4-5-6-7-8</text>
  <circle cx="276" cy="158" r="8" fill="#10B981"/>
  <circle cx="299" cy="158" r="8" fill="#10B981"/>
  <circle cx="322" cy="158" r="8" fill="#334155" stroke="#EF4444" stroke-width="2"/>
  <circle cx="345" cy="158" r="8" fill="#10B981"/>
  <text x="311" y="190" font-family="sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Ada Pin Mati / Tidak Nyala</text>

  <!-- 3. Miswired / Tertukar -->
  <rect x="416" y="52" width="182" height="154" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="507" y="76" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">MISWIRED (TERTUKAR)</text>
  <text x="507" y="108" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">M: 1-2-3-[4-5]-6-7-8</text>
  <text x="507" y="128" font-family="monospace" font-size="11" fill="#FBBF24" text-anchor="middle">R: 1-2-3-[5-4]-6-7-8</text>
  <circle cx="472" cy="158" r="8" fill="#10B981"/>
  <circle cx="495" cy="158" r="8" fill="#F59E0B"/>
  <circle cx="518" cy="158" r="8" fill="#F59E0B"/>
  <circle cx="541" cy="158" r="8" fill="#10B981"/>
  <text x="507" y="190" font-family="sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Urutan Remote Melompat</text>

  <!-- 4. Short / Korslet -->
  <rect x="612" y="52" width="184" height="154" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
  <text x="704" y="76" font-family="sans-serif" font-size="12" font-weight="bold" fill="#C084FC" text-anchor="middle">SHORT (KORSLETING)</text>
  <text x="704" y="108" font-family="monospace" font-size="11" fill="#E2E8F0" text-anchor="middle">M: Pin 6 Aktif</text>
  <text x="704" y="128" font-family="monospace" font-size="11" fill="#C084FC" text-anchor="middle">R: LED 6 &amp; 7 Nyala Bareng</text>
  <circle cx="670" cy="158" r="8" fill="#A855F7"/>
  <circle cx="693" cy="158" r="8" fill="#A855F7"/>
  <line x1="670" y1="158" x2="693" y2="158" stroke="#E9D5FF" stroke-width="3"/>
  <circle cx="716" cy="158" r="8" fill="#334155"/>
  <circle cx="739" cy="158" r="8" fill="#334155"/>
  <text x="704" y="190" font-family="sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">2 Pin Bersentuhan</text>
</svg>